name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_geopackage_tests:
        description: "Run optional GeoPackage integration tests"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with 100% coverage gate
        run: pytest

  geopackage-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_geopackage_tests }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[gpkg,test]"

      - name: Run GeoPackage integration tests
        run: pytest tests/test_geopackage_integration.py -q

