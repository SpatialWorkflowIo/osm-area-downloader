[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm-area-downloader"
version = "0.1.0"
description = "Beginner-friendly OpenStreetMap area downloader to GeoJSON or GeoPackage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7,<9.0.0",
  "requests>=2.32.0,<3.0.0",
]

[project.optional-dependencies]
gpkg = ["geopandas>=1.0.0"]

test = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
]

[project.scripts]
osm-area-downloader = "osm_area_downloader.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=osm_area_downloader --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["."]
